name: traillink
description: Hybrid outdoor communication and safety app foundation.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.6.2
  connectivity_plus: ^6.1.2
  intl: ^0.20.1
  path: ^1.9.0
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  socket_io_client: ^3.0.2
  uuid: ^4.5.1
  nearby_connections: ^4.3.0
  permission_handler: ^12.0.1
  device_info_plus: ^12.4.0
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.0
  record: ^6.2.0
  just_audio: ^0.9.46
  local_auth: ^3.0.1
  crypto: ^3.0.6
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  image_picker: ^1.2.2
  flutter_sound: 9.30.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/branding/
